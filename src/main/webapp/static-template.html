<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teach Yourself Bootstrap</title>

    <link href="includes/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }
        .hero {
            background: linear-gradient(135deg, #cc0000 0%, #0033cc 100%);
            color: #fff;
            padding: 60px 0 40px;
            margin-bottom: 40px;
        }
        .hero h1 {
            font-size: 2.8em;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .hero p {
            font-size: 1.2em;
            opacity: 0.85;
        }
        .hero a {
            color: #f8c;
        }
        .chapter-card {
            background: #fff;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,.08);
            margin-bottom: 30px;
            overflow: hidden;
        }
        .chapter-card .card-header {
            background-color: #cc0000;
            color: #fff;
            padding: 12px 20px;
            font-size: 1.1em;
            font-weight: 600;
        }
        .chapter-card ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .chapter-card ul li {
            border-bottom: 1px solid #f0f0f0;
            padding: 12px 20px;
        }
        .chapter-card ul li:last-child {
            border-bottom: none;
        }
        .chapter-card ul li a {
            color: #003399;
            font-weight: 500;
            text-decoration: none;
        }
        .chapter-card ul li a:hover {
            text-decoration: underline;
            color: #0055ff;
        }
        .chapter-card ul li .desc {
            color: #777;
            font-size: 0.9em;
            margin-left: 10px;
        }
        .navbar-default {
            background-color: #003399;
            border-color: #002277;
        }
        .navbar-default .navbar-brand,
        .navbar-default .navbar-nav > li > a {
            color: #ccd9ff;
        }
        .navbar-default .navbar-brand:hover,
        .navbar-default .navbar-nav > li > a:hover {
            color: #fff;
        }
        footer {
            background-color: #002277;
            color: #ccd9ff;
            padding: 20px 0;
            margin-top: 20px;
            text-align: center;
            font-size: 0.9em;
        }
        footer a {
            color: #99bbff;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-default">
    <div class="container">
        <div class="navbar-header">
            <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar" aria-expanded="false" aria-controls="navbar">
                <span class="sr-only">Toggle navigation</span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
                <span class="icon-bar"></span>
            </button>
            <a class="navbar-brand" href="#">Teach Yourself Bootstrap</a>
        </div>
        <div id="navbar" class="collapse navbar-collapse">
            <ul class="nav navbar-nav navbar-right">
                <li><a href="https://github.com/ronanos1979/TeachYourselfBootstrap">GitHub Source</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="hero">
    <div class="container">
        <h1>Teach Yourself Bootstrap</h1>
        <p>A hands-on guide to the Bootstrap CSS framework &mdash; chapter by chapter examples and exercises.</p>
    </div>
</div>

<div class="container">
    <div class="row">
<!-- CHAPTER_CARDS -->
    </div>
</div>

<footer>
    <div class="container">
        <p><a href="https://github.com/ronanos1979/TeachYourselfBootstrap">github.com/ronanos1979/TeachYourselfBootstrap</a> &mdash; based on original samples by <a href="https://github.com/htmljenn/Teach-Yourself-Bootstrap-Code-Samples">htmljenn</a></p>
    </div>
</footer>

<script src="/includes/js/jquery.min.js"></script>
<script src="/includes/js/bootstrap.min.js"></script>
</body>
</html>
