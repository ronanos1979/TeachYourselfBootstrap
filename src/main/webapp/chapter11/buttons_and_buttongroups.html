<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buttons and Button Groups</title>

    <style>
        .media-object {
            width: 150px;
        }
    </style>
    <!-- Bootstrap -->
    <link href="../includes/css/bootstrap.min.css" rel="stylesheet">
    <link href="../includes/css/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>

<div class="container">

    <div id="toc"></div>

    <h1>Buttons and Button Groups</h1>

    <div class="chapter-11-buttontags">
        <h1>Button Tags</h1>
        <a class="btn btn-default">Link</a>
        <button class="btn btn-default" type="submit">Button</button>
        <input type="button" class="btn btn-default" value="Input">
        <input type="submit" class="btn btn-default" value="Submit">
    </div>


    <div class="chapter-11-buttontypes">
        <h1>Button Types</h1>
        <button class="btn btn-default">Default</button>
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-info">Info</button>
        <button class="btn btn-warning">Warning</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-link">Link</button>
    </div>

    <div class="chapter-11-buttonsizes">
        <h1>Button Sizes</h1>
        <button class="btn btn-lg btn-default">Large</button>
        <button class="btn btn-primary">Medium</button>
        <button class="btn btn-success btn-sm">Small</button>        
        <button class="btn btn-xs btn-default">Extra Small</button>
        <button class="btn btn-danger btn-block">Block Level Button</button>
        <div class="row">
            <div class="col-xs-6">
                <button class="btn btn-info btn-block">Half WidthBlock Level Button</button>
            </div>
        </div>
    </div>

    <div class="chapter-11-buttongroups">
        <h1>Button Groups</h1>
        <div class="btn-group" role="group" aria-label="First group">
            <button type="button" class="btn btn-default">Fast</button>
            <button type="button" class="btn btn-default">Medium</button>
            <button type="button" class="btn btn-default">Slow</button>
        </div>
        
        <div class="btn-group-lg" role="group" aria-label="First group">
            <button type="button" class="btn btn-lg">Fast</button>
            <button type="button" class="btn btn-lg">Medium</button>
            <button type="button" class="btn btn-lg">Slow</button>
        </div>
        
        <div class="btn-group-sm" role="group" aria-label="First group">
            <button type="button" class="btn btn-group-sm">Fast</button>
            <button type="button" class="btn btn-group-sm">Medium</button>
            <button type="button" class="btn btn-group-sm">Slow</button>
        </div>
        <div class="btn-group-xs" role="group" aria-label="First group">
            <button type="button" class="btn btn-group-xs">Fast</button>
            <button type="button" class="btn btn-group-xs">Medium</button>
            <button type="button" class="btn btn-group-xs">Slow</button>
        </div>

        <div class="btn-group btn-group-justified" role="group" aria-label="First group">
            <a href="#" class="btn btn-default">Fast</a>
            <a href="#" class="btn btn-default">Medium</a>
            <a href="#" class="btn btn-default">Slow</a>
        </div>

        <div class="btn-group btn-group-justified" role="group" aria-label="First group">
            <div class="btn-group" role="group">
                 <button type="button" class="btn btn-default">Fast</button>
            </div>
            <div class="btn-group" role="group">
                 <button type="button" class="btn btn-default">Medium</button>
            </div>
            <div class="btn-group" role="group">
                 <button type="button" class="btn btn-default">Slow</button>
            </div>
        </div>
    
        <div class="chapter-11-buttontoolbars">
            <h1>Button Toolbars</h1>
            <div class="btn-toolbar"aria-label="Toolbar with button groups">
                <div class="btn-group" role="group" aria-label="First group">
                    <button type="button" class="btn btn-default">1</button>
                    <button type="button" class="btn btn-default">2</button>
                    <button type="button" class="btn btn-default">3</button>
                    <button type="button" class="btn btn-default">4</button>
                </div>
                <div class="btn-group" role="group" aria-label="Second group">
                    <button type="button" class="btn btn-default">5</button>
                    <button type="button" class="btn btn-default">6</button>
                    <button type="button" class="btn btn-default">7</button>
                </div>
                <div class="btn-group" role="group" aria-label="Third group">
                    <button type="button" class="btn btn-default">8</button>
                </div>
            </div>
        </div>
    </div>

</div>


<script>
    document.addEventListener('DOMContentLoaded', function () {
        var headings = document.querySelectorAll('.container h1');
        if (!headings.length) return;

        var items = Array.from(headings).map(function (h) {
            if (!h.id) {
                h.id = h.textContent.trim().toLowerCase().replace(/[^a-z0-9]+/g, '-');
            }
            return '<a href="#' + h.id + '" class="list-group-item">' + h.textContent.trim() + '</a>';
        });

        document.getElementById('toc').innerHTML =
            '<div class="panel panel-default">' +
            '<div class="panel-heading"><strong>Contents</strong></div>' +
            '<div class="list-group" style="margin-bottom:0">' + items.join('') + '</div>' +
            '</div>';
    });
</script>

<!-- jQuery (necessary for Bootstrap's JavaScript plugins) -->
<script src="../includes/js/jquery.min.js"></script>
<!-- Include all compiled plugins (below), or include individual files as needed -->
<script src="../includes/js/bootstrap.min.js"></script>
</body>
</html>
